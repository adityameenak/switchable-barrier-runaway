name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run validation tests
        run: pytest -v
      - name: Smoke-test the figure pipeline
        run: python -m runaway.demo --quick --out /tmp/figures
      - name: Smoke-test the explorer build
        run: python -m runaway.explorer --quick --out /tmp/explorer.html
